services:
  - type: web
    runtime: static
    name: football-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Paste the Render API URL, for example https://football-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
