server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $booking_api http://api:8080;
        proxy_pass $booking_api;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
